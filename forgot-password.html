<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walking in London — Forgot Password</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="site-nav__link">Home</a>
    <a href="quiz.html" class="site-nav__link">Quiz</a>
    <a href="how-to-participate.html" class="site-nav__link">How to Participate</a>
  </nav>

  <main class="page">
    <header class="hero">
      <p class="hero__kicker"><a href="index.html">WALKING IN LONDON</a></p>
      <h1 class="hero__title">Giveaway Draw &mdash; Forgot Password</h1>
      <div class="hero__rule"></div>
    </header>

    <section class="card">
      <p class="intro">
        Enter your email and we'll send you a link to reset your password.
      </p>

      <form id="forgot-form" class="form" novalidate>
        <div class="field">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" name="forgot-email" autocomplete="email" required>
        </div>

        <button type="submit" class="btn" id="forgot-btn">Send Reset Link</button>
      </form>

      <p id="forgot-message" class="form-message" role="status" aria-live="polite"></p>
    </section>

    <footer class="footer">
      <p>&copy; 2026 Walking in London</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
