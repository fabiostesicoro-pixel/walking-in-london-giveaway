<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walking in London — Reset Password</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="site-nav">
    <a href="index.html" class="site-nav__link">Home</a>
    <a href="quiz.html" class="site-nav__link">Quiz</a>
    <a href="how-to-participate.html" class="site-nav__link">How to Participate</a>
  </nav>

  <main class="page">
    <header class="hero">
      <p class="hero__kicker"><a href="index.html">WALKING IN LONDON</a></p>
      <h1 class="hero__title">Giveaway Draw &mdash; Reset Password</h1>
      <div class="hero__rule"></div>
    </header>

    <section class="card">
      <p class="intro" id="reset-intro">
        Choose a new password below.
      </p>

      <form id="reset-form" class="form" novalidate hidden>
        <div class="field">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" name="new-password" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="field">
          <label for="new-password-confirm">Confirm New Password</label>
          <input type="password" id="new-password-confirm" name="new-password-confirm" autocomplete="new-password" minlength="6" required>
        </div>

        <button type="submit" class="btn" id="reset-btn">Set New Password</button>
      </form>

      <p id="reset-message" class="form-message" role="status" aria-live="polite"></p>
    </section>

    <footer class="footer">
      <p>&copy; 2026 Walking in London</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
